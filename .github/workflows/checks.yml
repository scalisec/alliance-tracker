name: Checks on suggested changes

# Runs the same checks as a publish (parser tests + screen tests) on every pull
# request, e.g. Dependabot's update suggestions, so they show a pass/fail before
# anyone merges them. Nothing is published from here.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moved to Ubuntu 26, which the test browser installer does not support yet
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci && npm run build
      - name: Parser checks
        run: npm test
      - name: Screen tests
        timeout-minutes: 8
        run: |
          # Use the Chrome that comes with GitHub's machine; only download a browser
          # (with retries, for network hiccups) if it's missing.
          if command -v google-chrome >/dev/null; then
            export PW_CHANNEL=chrome
          else
            for i in 1 2 3; do npx playwright install --with-deps chromium && break; echo "retry $i"; sleep 30; done
          fi
          npx playwright test
