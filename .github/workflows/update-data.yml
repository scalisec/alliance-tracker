name: Update data and publish

# Times are UTC. Toronto is UTC-4 until Nov 1, then UTC-5; the windows below
# cover both. Live runs exit early (no page reads) when no games are due.
#
# GitHub's scheduler often skips frequent schedules, so during game windows each
# live run starts the next one ~20 minutes later itself (job "next"). The cron
# lines below then act as a backup that restarts the chain if it ever stops.
on:
  schedule:
    - cron: '15 8 * * *'          # nightly full sync (~3-4 AM Toronto)
    - cron: '35 9 * * 1'          # weekly: MD schedules + MHR ratings (Mon)
    - cron: '7-59/20 11-23 * * 0,6' # weekends, daytime: every 20 min
    - cron: '7-59/20 0-4 * * 0,1'   # weekend evenings (Sat/Sun night Toronto)
    - cron: '11-59/30 21-23 * * 1-5' # weekday evenings: every 30 min
    - cron: '11-59/30 0-4 * * 2-6'   # weekday evenings, after midnight UTC
  workflow_dispatch:
    inputs:
      mode:
        description: 'Collector mode'
        type: choice
        options: [live, full, weekly]
        default: full

# Least privilege: nothing by default; each job gets only what it needs.
permissions: {}

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write   # commit the refreshed data
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Pick mode
        id: mode
        run: |
          case "${{ github.event.schedule }}" in
            "15 8 * * *") echo "mode=full" >> $GITHUB_OUTPUT ;;
            "35 9 * * 1") echo "mode=weekly" >> $GITHUB_OUTPUT ;;
            "") echo "mode=${{ inputs.mode || 'full' }}" >> $GITHUB_OUTPUT ;;
            *) echo "mode=live" >> $GITHUB_OUTPUT ;;
          esac
      - name: Collect (${{ steps.mode.outputs.mode }})
        run: node collector/run.js ${{ steps.mode.outputs.mode }}
        env:
          MAX_REQUESTS: ${{ steps.mode.outputs.mode == 'full' && '700' || '80' }}
      - name: Rebuild icons (only when the Alliance logo changed)
        run: |
          if [ -n "$(git status --porcelain public/assets)" ] || [ ! -f public/icons/icon-192.png ]; then
            node scripts/make-icons.js
          else
            echo "Logo unchanged; icons kept."
          fi
      - name: Commit data if changed
        id: commit
        run: |
          git config user.name "alliance-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data public/assets public/icons public/logos
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "data: ${{ steps.mode.outputs.mode }} update"
            # Another job (e.g. a capture) may have pushed meanwhile: rebase and retry.
            for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

  deploy:
    needs: collect
    permissions:
      contents: read
      pages: write
      id-token: write
    if: needs.collect.outputs.changed == 'true' || (github.event_name == 'workflow_dispatch' && needs.collect.outputs.mode != 'live')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency: { group: pages, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci && npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: deploy
        uses: actions/deploy-pages@v5

  next:
    # Keep live updates coming every ~20 min during game windows.
    needs: [collect, deploy]
    if: always() && needs.collect.outputs.mode == 'live'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: write    # start the next live run
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Schedule the next live update
        run: |
          # Game windows (Toronto): weekends 7:00-23:40, weekdays 17:00-23:40.
          H=$(TZ=America/Toronto date +%-H); M=$(TZ=America/Toronto date +%-M); D=$(TZ=America/Toronto date +%u)
          if [ "$D" -ge 6 ]; then FIRST=7; else FIRST=17; fi
          if [ "$H" -lt "$FIRST" ] || { [ "$H" -eq 23 ] && [ "$M" -gt 40 ]; }; then
            echo "Outside the game window; the chain stops until the next scheduled run."; exit 0
          fi
          # Start the next run 20 minutes after this one started.
          STARTED=$(gh api "repos/$GH_REPO/actions/runs/${{ github.run_id }}" --jq .run_started_at)
          WAIT=$(( 1200 - ( $(date +%s) - $(date -d "$STARTED" +%s) ) ))
          if [ "$WAIT" -gt 0 ]; then echo "Waiting ${WAIT}s"; sleep "$WAIT"; fi
          # Don't start a second chain if another update is already queued or running.
          OTHERS=$(gh run list -w update-data.yml -L 20 --json databaseId,status \
            --jq '[.[] | select(.databaseId != ${{ github.run_id }}) | select(.status != "completed")] | length')
          if [ "$OTHERS" -gt 0 ]; then echo "Another update is already queued or running."; exit 0; fi
          gh workflow run update-data.yml -f mode=live
          echo "Next live update started."
