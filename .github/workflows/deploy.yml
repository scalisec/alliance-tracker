name: Publish app on code change

on:
  push:
    branches: [main]
    paths-ignore: ['public/data/**', 'public/logos/**', 'fixtures/**', '**.md']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moved to Ubuntu 26, which the test browser installer does not support yet
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci && npm run build
      # Checks before publishing: a failure here stops a broken version going live.
      - name: Parser checks
        run: npm test
      - name: Screen tests (click through the main screens)
        run: npx playwright install --with-deps chromium && npx playwright test
      - name: Keep the screen-test report if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: screen-test-report, path: test-results, retention-days: 7 }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: deploy
        uses: actions/deploy-pages@v4
