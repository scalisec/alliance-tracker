<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Alliance Tracker" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="Unofficial standings, scores and schedules for ALLIANCE Hockey rep divisions." />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <title>Alliance Tracker</title>
    <script>
      try {
        var t = localStorage.getItem('at.theme') || 'dark';
        document.documentElement.dataset.theme = t;
      } catch (e) { document.documentElement.dataset.theme = 'dark'; }
    </script>
    <style>
      html, body { margin: 0; background: #0a0a0a; }
      html[data-theme='light'], html[data-theme='light'] body { background: #f2f3f6; }
      /* ---------- splash ---------- */
      #splash {
        position: fixed; inset: 0; z-index: 100; display: grid; place-items: center;
        background: #0a0a0a; transition: opacity .35s ease;
      }
      :root[data-theme='light'] #splash { background: #f2f3f6; }
      #splash.hide { opacity: 0; pointer-events: none; }
      #splash .mark { display: grid; justify-items: center; gap: 14px; animation: splash-in .5s ease both; }
      #splash img { width: 112px; height: 112px; object-fit: contain; }
      #splash .name { font: 700 15px/1 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; letter-spacing: .14em; text-transform: uppercase; color: #8b8f94; }
      @keyframes splash-in { from { opacity: 0; transform: scale(.92); } }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="mark">
        <img src="assets/alliance-logo.png" alt="" onerror="this.style.display='none'" />
        <div class="name">Alliance Tracker</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
